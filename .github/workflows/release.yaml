name: Publish installable ZIP
on:
  push:
    paths:
      - 'custom_components/lg_thinq_native_timer/manifest.json'
  workflow_dispatch:
    inputs:
      version:
        description: Release tag
        default: v0.2.1
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/card.test.cjs
      - name: Package
        run: |
          cd custom_components
          zip -r ../lg_thinq_native_timer.zip lg_thinq_native_timer -x '*/__pycache__/*'
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          if [ -z "$VERSION" ]; then
            VERSION="v$(python -c "import json; print(json.load(open('custom_components/lg_thinq_native_timer/manifest.json'))['version'])")"
          fi
          gh release create "$VERSION" lg_thinq_native_timer.zip --title "$VERSION" --generate-notes
