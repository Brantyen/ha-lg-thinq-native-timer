name: Validate integration and card
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m compileall -q custom_components
      - run: python -m unittest discover -s tests -v
      - run: node --check custom_components/lg_thinq_native_timer/frontend/lg-thinq-timer-card.js
      - run: node --test tests/card.test.cjs
